syntax = "proto3";

import "google/protobuf/empty.proto";

package main;

option go_package = "./grpc";

message BidRequest {
  string bidder = 1;
  int32 amount = 2;
}

message BidResponse {
  string status = 1;
}

message ResultRequest {}

message ResultResponse {
  bool finished = 1;
  string highest_bidder = 2;
  int32 highest_bid = 3;
}

message ReplicationMessage {
  string bidder = 1;
  int32 amount = 2;
}

service AuctionService {

  rpc Bid(BidRequest)
      returns(BidResponse);

  rpc Result(ResultRequest)
      returns(ResultResponse);

  rpc ReplicateBid(ReplicationMessage)
      returns(google.protobuf.Empty);
}